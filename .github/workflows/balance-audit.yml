name: Balance audit

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Existing build and rule tests
        run: npm test
      - name: Configure approximately 3000 campaign simulations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/survival-composition-audit.ts')
          s = p.read_text()
          s = s.replace('Math.max(80, Number(process.env.SURVIVAL_SCREEN_TRIALS ?? 220))', 'Math.max(20, Number(process.env.SURVIVAL_SCREEN_TRIALS ?? 25))')
          s = s.replace('Math.max(80, Number(process.env.SURVIVAL_CALIBRATION_TRIALS ?? 220))', 'Math.max(20, Number(process.env.SURVIVAL_CALIBRATION_TRIALS ?? 30))')
          s = s.replace('Math.max(500, Number(process.env.SURVIVAL_FINAL_TRIALS ?? 3000))', 'Math.max(200, Number(process.env.SURVIVAL_FINAL_TRIALS ?? 300))')
          s = s.replace('Math.max(4, Number(process.env.SURVIVAL_FINALIST_COUNT ?? 6))', 'Math.max(2, Number(process.env.SURVIVAL_FINALIST_COUNT ?? 3))')
          p.write_text(s)
          PY
      - name: Survival enemy composition search
        env:
          SURVIVAL_SCREEN_TRIALS: 25
          SURVIVAL_CALIBRATION_TRIALS: 30
          SURVIVAL_FINAL_TRIALS: 300
          SURVIVAL_FINALIST_COUNT: 3
        run: node --experimental-strip-types scripts/survival-composition-audit.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-blue-grid-survival-composition-audit
          path: artifacts/deep-blue-grid-survival-composition-audit.*
          if-no-files-found: warn
