<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1480"
     height="236"
     viewBox="0 0 1480 236">
  <title>DEEP BLUE GRID command button state strip</title>
  <desc>
    Web-canonical layered command surfaces for Unity recreation:
    normal, selected, pressed, disabled, confirmation-ready, and battle-start.
  </desc>

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2635"/>
      <stop offset="1" stop-color="#06131d"/>
    </linearGradient>
    <linearGradient id="normal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183b45"/>
      <stop offset="1" stop-color="#0a222c"/>
    </linearGradient>
    <linearGradient id="confirm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#756329"/>
      <stop offset="1" stop-color="#302a17"/>
    </linearGradient>
    <linearGradient id="battle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8342f"/>
      <stop offset="1" stop-color="#4a1210"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#61dbd6" flood-opacity=".3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amberGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#e5d78a" flood-opacity=".33" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dangerGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#ff5757" flood-opacity=".3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 .5H4" stroke="#ffffff" stroke-opacity=".018" stroke-width="1"/>
      <path d="M0 3.5H4" stroke="#010a0f" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1480" height="236" fill="url(#room)"/>
  <text x="34" y="30"
        fill="#71909b"
        font-family="'Courier New','Yu Gothic UI',monospace"
        font-size="11"
        letter-spacing="3">COMMAND SURFACE STATES // WEB CANONICAL LAYER REFERENCE</text>

  <!-- NORMAL -->
  <g id="state-normal" transform="translate(28 63)">
    <rect x="0" y="3" width="220" height="82" fill="#041015"/>
    <rect x="0" y="0" width="220" height="82" fill="url(#normal)" stroke="#52727a"/>
    <path d="M.5 81.5H219.5" stroke="#203b43"/>
    <rect x="3" y="3" width="214" height="76" fill="none" stroke="#07171f" stroke-width="2"/>
    <text x="14" y="33" fill="#7ce5df" font-family="'Courier New',monospace" font-size="15" font-weight="700">1 / MAIN GUN</text>
    <text x="14" y="55" fill="#71909b" font-family="'Courier New',monospace" font-size="10">UNLIMITED</text>
    <text x="110" y="108" fill="#71909b" font-family="'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">NORMAL</text>
  </g>

  <!-- SELECTED: cyan border and restrained 14px-equivalent glow. -->
  <g id="state-selected" transform="translate(269 63)" filter="url(#cyanGlow)">
    <rect x="0" y="3" width="220" height="82" fill="#041015"/>
    <rect x="0" y="0" width="220" height="82" fill="url(#normal)" stroke="#7ce5df"/>
    <path d="M.5 81.5H219.5" stroke="#203b43"/>
    <rect x="3" y="3" width="214" height="76" fill="none" stroke="#07171f" stroke-width="2"/>
    <text x="14" y="33" fill="#7ce5df" font-family="'Courier New',monospace" font-size="15" font-weight="700">3 / HARPOON</text>
    <text x="14" y="55" fill="#71909b" font-family="'Courier New',monospace" font-size="10">REMAINING 2 / 2</text>
    <text x="110" y="108" fill="#71909b" font-family="'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">SELECTED</text>
  </g>

  <!-- PRESSED: content moves down two pixels; bottom extrusion contracts from 3px to 1px. -->
  <g id="state-pressed" transform="translate(510 65)">
    <rect x="0" y="1" width="220" height="82" fill="#041015"/>
    <rect x="0" y="0" width="220" height="82" fill="url(#normal)" stroke="#52727a"/>
    <path d="M.5 81.5H219.5" stroke="#203b43"/>
    <rect x="3" y="3" width="214" height="76" fill="none" stroke="#07171f" stroke-width="2"/>
    <text x="14" y="33" fill="#7ce5df" font-family="'Courier New',monospace" font-size="15" font-weight="700">FIRE</text>
    <text x="14" y="55" fill="#71909b" font-family="'Courier New',monospace" font-size="10">TARGET LOCKED</text>
    <text x="110" y="106" fill="#71909b" font-family="'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">PRESSED +2 PX</text>
  </g>

  <!-- DISABLED: CSS opacity .4 plus a desaturated abyss veil. -->
  <g id="state-disabled" transform="translate(751 63)" opacity=".4">
    <rect x="0" y="3" width="220" height="82" fill="#041015"/>
    <rect x="0" y="0" width="220" height="82" fill="url(#normal)" stroke="#52727a"/>
    <path d="M.5 81.5H219.5" stroke="#203b43"/>
    <rect x="3" y="3" width="214" height="76" fill="none" stroke="#07171f" stroke-width="2"/>
    <rect x="1" y="1" width="218" height="80" fill="#06131d" fill-opacity=".22"/>
    <text x="14" y="33" fill="#7ce5df" font-family="'Courier New',monospace" font-size="15" font-weight="700">4 / F-4 PHANTOM</text>
    <text x="14" y="55" fill="#71909b" font-family="'Courier New',monospace" font-size="10">AIR WING LOST</text>
    <text x="110" y="108" fill="#71909b" font-family="'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">DISABLED .40</text>
  </g>

  <!-- CONFIRM READY -->
  <g id="state-confirm-ready" transform="translate(992 63)" filter="url(#amberGlow)">
    <rect x="0" y="3" width="220" height="82" fill="#041015"/>
    <rect x="0" y="0" width="220" height="82" fill="url(#confirm)" stroke="#e5d78a"/>
    <path d="M.5 81.5H219.5" stroke="#302a17"/>
    <rect x="3" y="3" width="214" height="76" fill="none" stroke="#151108" stroke-width="2"/>
    <text x="14" y="33" fill="#fff6bd" font-family="'Courier New',monospace" font-size="15" font-weight="700">REPORT FILED</text>
    <text x="14" y="55" fill="#e5d78a" font-family="'Courier New',monospace" font-size="10">PROCEED TO ATTACK</text>
    <text x="110" y="108" fill="#e5d78a" font-family="'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">CONFIRM READY</text>
  </g>

  <!-- BATTLE START -->
  <g id="state-battle-start" transform="translate(1233 63)" filter="url(#dangerGlow)">
    <rect x="0" y="3" width="220" height="82" fill="#041015"/>
    <rect x="0" y="0" width="220" height="82" fill="url(#battle)" stroke="#ff8585"/>
    <path d="M.5 81.5H219.5" stroke="#4a1210"/>
    <rect x="3" y="3" width="214" height="76" fill="none" stroke="#07171f" stroke-width="2"/>
    <text x="14" y="33" fill="#ffe4e0" font-family="'Courier New',monospace" font-size="15" font-weight="700">BATTLE START</text>
    <text x="14" y="55" fill="#ffb9b0" font-family="'Courier New',monospace" font-size="10">SORTIE CONFIRMED</text>
    <text x="110" y="108" fill="#ff8585" font-family="'Courier New',monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">BATTLE START</text>
  </g>

  <rect width="1480" height="236" fill="url(#scanlines)"/>
</svg>
