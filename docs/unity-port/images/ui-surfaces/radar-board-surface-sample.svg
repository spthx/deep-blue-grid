<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="768"
     height="768"
     viewBox="0 0 768 768">
  <title>DEEP BLUE GRID radar board surface reference</title>
  <desc>
    Vector reference for the Web canonical CIC panel, contact grid, vignette,
    phosphor scanlines, restrained noise, and cyan radar sweep.
  </desc>

  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="-10%" r="70%">
      <stop offset="0" stop-color="#174a5b"/>
      <stop offset=".42" stop-color="#06131d" stop-opacity="0"/>
      <stop offset="1" stop-color="#06131d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panelFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193843"/>
      <stop offset=".035" stop-color="#0a202a"/>
      <stop offset=".965" stop-color="#0a202a"/>
      <stop offset="1" stop-color="#193843"/>
    </linearGradient>

    <linearGradient id="sweepFade" x1=".08" y1=".02" x2=".92" y2=".98">
      <stop offset="0" stop-color="#7ce5df" stop-opacity="0"/>
      <stop offset=".62" stop-color="#7ce5df" stop-opacity=".35"/>
      <stop offset=".86" stop-color="#7ce5df" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7ce5df" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="boardVignette" cx="50%" cy="50%" r="72%">
      <stop offset=".54" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".69"/>
    </radialGradient>

    <pattern id="gridCells" width="77" height="77" patternUnits="userSpaceOnUse">
      <rect width="77" height="77" fill="#0a303a"/>
      <path d="M0 0H77V77" fill="none" stroke="#71909b" stroke-opacity=".27" stroke-width="1"/>
      <path d="M0 28.5H77" fill="none" stroke="#7ce5df" stroke-opacity=".06" stroke-width="1"/>
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 .5H4" stroke="#ffffff" stroke-opacity=".018" stroke-width="1"/>
      <path d="M0 3.5H4" stroke="#010a0f" stroke-opacity=".16" stroke-width="1"/>
    </pattern>

    <pattern id="noise" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="#dfffff" fill-opacity=".06">
        <circle cx="4" cy="7" r=".72"/>
        <circle cx="33" cy="7" r=".72"/>
        <circle cx="62" cy="7" r=".72"/>
        <circle cx="4" cy="38" r=".72"/>
        <circle cx="33" cy="38" r=".72"/>
        <circle cx="62" cy="38" r=".72"/>
        <circle cx="14" cy="18" r=".62"/>
        <circle cx="57" cy="18" r=".62"/>
        <circle cx="14" cy="63" r=".62"/>
        <circle cx="57" cy="63" r=".62"/>
      </g>
    </pattern>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity=".6"/>
    </filter>

    <filter id="sweepSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <clipPath id="boardClip">
      <rect x="76" y="107" width="616" height="616"/>
    </clipPath>
  </defs>

  <!-- BODY: abyss token plus the canonical top-centred cyan room glow. -->
  <rect width="768" height="768" fill="#06131d"/>
  <rect width="768" height="768" fill="url(#roomGlow)"/>

  <!-- TACTICAL PANEL: clipped corners, four-pixel inset construction, hard navy shadow. -->
  <g filter="url(#panelShadow)">
    <path d="M27 17H741L751 27V741L741 751H27L17 741V27Z"
          fill="url(#panelFace)"
          stroke="#41636d"
          stroke-width="2"/>
    <path d="M31 24H737L744 31V737L737 744H31L24 737V31Z"
          fill="none"
          stroke="#07141b"
          stroke-width="7"/>
    <path d="M35 28H733L740 35V733L733 740H35L28 733V35Z"
          fill="none"
          stroke="#294d57"
          stroke-width="2"/>
  </g>

  <!-- PANEL HEADER -->
  <g font-family="'Courier New','Yu Gothic UI',monospace">
    <text x="48" y="57" fill="#7ce5df" font-size="13" font-weight="700" letter-spacing="3">HOSTILE WATERS // CONTACT GRID</text>
    <text x="718" y="57" fill="#71909b" font-size="9" text-anchor="end" letter-spacing="1.6">TACTICAL DISPLAY</text>
  </g>
  <path d="M48 70H720" stroke="#294d57" stroke-width="1"/>

  <!-- CANVAS WRAP: four-pixel abyss surround, two-pixel steel rim, deep inner vignette. -->
  <rect x="43" y="74" width="682" height="682" fill="#07131a"/>
  <rect x="47" y="78" width="674" height="674" fill="#092934" stroke="#52757d" stroke-width="2"/>
  <rect x="76" y="107" width="616" height="616" fill="url(#gridCells)"/>

  <!-- Coordinate scale remains subdued; the tactical data is brighter than the furniture. -->
  <g fill="#71909b"
     font-family="'Courier New','Yu Gothic UI',monospace"
     font-size="10"
     text-anchor="middle">
    <text x="114.5" y="99">1</text>
    <text x="191.5" y="99">2</text>
    <text x="268.5" y="99">3</text>
    <text x="345.5" y="99">4</text>
    <text x="422.5" y="99">5</text>
    <text x="499.5" y="99">6</text>
    <text x="576.5" y="99">7</text>
    <text x="653.5" y="99">8</text>
  </g>
  <g fill="#71909b"
     font-family="'Courier New','Yu Gothic UI',monospace"
     font-size="10"
     text-anchor="middle"
     dominant-baseline="middle">
    <text x="61" y="145.5">A</text>
    <text x="61" y="222.5">B</text>
    <text x="61" y="299.5">C</text>
    <text x="61" y="376.5">D</text>
    <text x="61" y="453.5">E</text>
    <text x="61" y="530.5">F</text>
    <text x="61" y="607.5">G</text>
    <text x="61" y="684.5">H</text>
  </g>

  <!-- Radar sweep: intentionally faint (.09), like the Web conic layer. -->
  <g clip-path="url(#boardClip)" opacity=".09" filter="url(#sweepSoft)">
    <path d="M384 415L584 107H692V330Z" fill="url(#sweepFade)"/>
    <path d="M384 415L584 107" stroke="#7ce5df" stroke-width="2" stroke-opacity=".75"/>
  </g>

  <!-- Inner canvas-wrap vignette, then the global texture passes. -->
  <rect x="47" y="78" width="674" height="674" fill="url(#boardVignette)"/>
  <rect width="768" height="768" fill="url(#noise)"/>
  <rect width="768" height="768" fill="url(#scanlines)"/>
</svg>
