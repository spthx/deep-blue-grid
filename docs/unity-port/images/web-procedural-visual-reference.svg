      <rect x="82" y="42" width="46" height="46" transform="rotate(45 105 65)" fill="none" stroke="#e5d78a" stroke-width="4"/>
      <text x="105" y="38" text-anchor="middle" class="mono label" fill="#fff0b5">CV</text>
      <text x="18" y="125" class="mono label">IDENTIFIED</text>
    </g>

    <g transform="translate(35 610)">
      <rect width="210" height="140" fill="#071a25" stroke="#164451"/>
      <circle cx="105" cy="65" r="18" fill="none" stroke="#7ce5df" stroke-width="3" opacity=".55"/>
      <circle cx="105" cy="65" r="38" fill="none" stroke="#7ce5df" stroke-width="3" opacity=".25"/>
      <text x="18" y="125" class="mono label">SUB WAKE</text>
    </g>

    <g transform="translate(280 610)">
      <rect width="210" height="140" fill="#071a25" stroke="#164451"/>
      <rect x="55" y="15" width="100" height="100" fill="none" stroke="#e5d78a" stroke-width="3" stroke-dasharray="16 11"/>
      <path d="M55 49 V15 H89 M121 15 H155 V49 M55 81 V115 H89 M121 115 H155 V81" fill="none" stroke="#e5d78a" stroke-width="5"/>
      <circle cx="105" cy="65" r="25" fill="none" stroke="#e5d78a" stroke-width="3" stroke-dasharray="12 9"/>
      <text x="18" y="132" class="mono label">CONTACT</text>
    </g>

    <g transform="translate(35 780)">
      <rect width="210" height="140" fill="#071a25" stroke="#164451"/>
      <rect x="55" y="15" width="100" height="100" fill="none" stroke="#60be9d" stroke-width="3" stroke-dasharray="8 12"/>
      <path d="M55 49 V15 H89 M121 15 H155 V49 M55 81 V115 H89 M121 115 H155 V81" fill="none" stroke="#60be9d" stroke-width="5"/>
