      <text x="18" y="125" class="mono label">HIT</text>
    </g>

    <g transform="translate(280 270)">
      <rect width="210" height="140" fill="#071a25" stroke="#164451"/>
      <path transform="translate(105 65)" d="M0,-27 L6,-11 L19,-19 L11,-6 L27,0 L11,6 L19,19 L6,11 L0,27 L-6,11 L-19,19 L-11,6 L-27,0 L-11,-6 L-19,-19 L-6,-11 Z" fill="#e5d78a"/>
      <text x="18" y="125" class="mono label">SUNK</text>
