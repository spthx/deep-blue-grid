    <text x="24" y="89" class="mono note">Shapes below show a mid-animation frame.</text>

    <g transform="translate(35 100)">
      <rect width="210" height="140" fill="#071a25" stroke="#164451"/>
      <circle cx="70" cy="65" r="13" fill="none" stroke="#71909b" stroke-width="5"/>
      <rect x="67.5" y="62.5" width="5" height="5" fill="#71909b"/>
      <text x="18" y="125" class="mono label">MISS</text>
    </g>

    <g transform="translate(280 100)">
      <rect width="210" height="140" fill="#071a25" stroke="#164451"/>
      <g transform="translate(105 65)" stroke="#7ce5df" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
        <circle r="8"/>
        <path d="M0,-8 V-29 M-8,-20 L0,-29 L8,-20 M0,8 V29 M-8,20 L0,29 L8,20 M-8,0 H-29 M-20,-8 L-29,0 L-20,8 M8,0 H29 M20,-8 L29,0 L20,8"/>
