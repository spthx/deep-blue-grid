<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#164451" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Courier New", "Yu Gothic UI", monospace; }
      .label { fill:#d8fffb; font-size:24px; font-weight:700; letter-spacing:2px; }
      .sub { fill:#71909b; font-size:18px; }
      .note { fill:#9cb8bd; font-size:16px; }
      .ship { fill:#71909b; opacity:.88; }
      .deck { fill:#b0ced0; }
      .deckDark { fill:#173b45; }
      .hullLine { stroke:#163b45; stroke-width:3; fill:none; }
      .panel { fill:#0a2635; stroke:#315e69; stroke-width:2; }
    </style>
  </defs>

  <rect width="1600" height="1480" fill="#06131d"/>
  <rect x="24" y="24" width="1552" height="1432" rx="2" fill="url(#grid)" stroke="#315e69" stroke-width="2"/>
  <text x="70" y="82" class="mono label" font-size="34">DEEP BLUE GRID / WEB PROCEDURAL VISUAL REFERENCE</text>
  <text x="70" y="115" class="mono note">Canonical source: Renderer.ts @ 69f5c566ebfde8cb0eca814fe0f5d8f04b291834 — runtime Canvas 2D, not bitmap sprites</text>

