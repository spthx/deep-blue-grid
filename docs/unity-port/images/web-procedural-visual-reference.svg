      <text x="79" y="64" class="mono label" font-size="18" fill="#fff0b5">CV+BB</text>
      <text x="18" y="132" class="mono label">SUPPORT ZONE</text>
    </g>

    <g transform="translate(35 950)">
      <text x="0" y="0" class="mono note">Opacity/timing anchors:</text>
      <text x="0" y="28" class="mono note">• Wake: p=(t×1.25)%1; 2 rings, offset .42</text>
      <text x="0" y="56" class="mono note">• Hit/Sunk pulse: α=.7+.25×sin(t×8)</text>
      <text x="0" y="84" class="mono note">• Identification pulse: α=.82+.16×sin(t×5)</text>
      <text x="0" y="112" class="mono note">• Radar pulse: α=.72+.18×sin(t×3.4)</text>
    </g>
