    <text x="24" y="67" class="mono note">Renderer.drawShip geometry. Flat top-down CIC symbols only.</text>
    <text x="24" y="89" class="mono note">No detailed paint, texture, shadow, perspective or external sprite.</text>

    <!-- Carrier: cell=100, len=400, width=145 -->
    <g transform="translate(620 185) scale(.88)">
      <path d="M-192,-60.9 L152,-69.6 L200,-31.9 L200,31.9 L152,69.6 L-192,60.9 Z" class="ship"/>
      <rect x="-144" y="-5.5" width="288" height="11" class="deckDark"/>
      <rect x="-5" y="-55.1" width="12" height="110.2" class="deckDark"/>
      <rect x="72" y="-53.65" width="38" height="32" class="deck"/>
      <rect x="82" y="-75.4" width="10" height="18" class="deck"/>
