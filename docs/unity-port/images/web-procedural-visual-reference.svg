      <rect x="142" width="112" height="42" fill="#0a2635" stroke="#71909b"/><text x="198" y="70" text-anchor="middle" class="mono note">#0A2635</text>
      <rect x="284" width="112" height="42" fill="#71909b"/><text x="340" y="70" text-anchor="middle" class="mono note">#71909B</text>
      <rect x="426" width="112" height="42" fill="#7ce5df"/><text x="482" y="70" text-anchor="middle" class="mono note">#7CE5DF</text>
      <rect x="568" width="112" height="42" fill="#e5d78a"/><text x="624" y="70" text-anchor="middle" class="mono note">#E5D78A</text>
      <rect x="710" width="112" height="42" fill="#ff8585"/><text x="766" y="70" text-anchor="middle" class="mono note">#FF8585</text>
      <rect x="852" width="112" height="42" fill="#b0ced0"/><text x="908" y="70" text-anchor="middle" class="mono note">#B0CED0</text>
      <rect x="994" width="112" height="42" fill="#584e51"/><text x="1050" y="70" text-anchor="middle" class="mono note">SUNK HULL</text>
